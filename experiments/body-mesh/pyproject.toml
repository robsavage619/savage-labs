[project]
name = "body-mesh"
version = "0.1.0"
description = "Trial: fit a 3D body (MHR) to SHC progress photos and read tape-style girths off it"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mhr>=1.0.1",
    "pymomentum-cpu",
    "trimesh>=4.8.3,<5",
    "mapbox-earcut",
    "scipy",
    "shapely",
    "pillow",
    "requests",
    "shc",
    "pooch>=1.9.0",
]

[tool.uv]
# MHR's solver ships wheels for Apple Silicon; the Intel host cannot run this.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
package = false

[tool.uv.sources]
shc = { path = "../../backend", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.ruff.lint.isort]
known-first-party = ["compare", "fit", "tape"]
known-third-party = ["shc"]
