<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Self-experiment engine"><title>Self-experiment engine</title><defs><marker id="a-5cc8e6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#5cc8e6"/></marker><marker id="a-a3b3c3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#a3b3c3"/></marker><marker id="a-5fd39a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#5fd39a"/></marker><marker id="a-4fd0bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#4fd0bd"/></marker><marker id="a-ec7a63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#ec7a63"/></marker><marker id="a-e7be57" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#e7be57"/></marker><marker id="a-74869a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#74869a"/></marker></defs><rect width="1200" height="400" rx="18" fill="#0b1016"/><rect x=".5" y=".5" width="1199" height="399" rx="17.5" fill="none" stroke="#2a3847"/><text x="32" y="44" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5cc8e6" text-anchor="start" letter-spacing="2.2">SELF-EXPERIMENT ENGINE</text><text x="32" y="68" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3b3c3" text-anchor="start">A result can change the engine only by passing the same gate-and-audit path as everything else.</text><rect x="32" y="110" width="200" height="104" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="32" y="120" width="3" height="84" rx="1.5" fill="#5cc8e6"/><text x="48" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="650" fill="#e9eff5" text-anchor="start">preregister()</text><text x="48" y="153" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">hypothesis, design and</text><text x="48" y="169" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">analysis plan are locked</text><path d="M234 162 L256 162" fill="none" stroke="#74869a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-74869a)"/><rect x="258" y="110" width="200" height="104" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="258" y="120" width="3" height="84" rx="1.5" fill="#5cc8e6"/><text x="274" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="650" fill="#e9eff5" text-anchor="start">arm_for_day()</text><text x="274" y="153" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">balanced, deterministic,</text><text x="274" y="169" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">fixed before outcomes exist</text><path d="M460 162 L482 162" fill="none" stroke="#74869a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-74869a)"/><rect x="484" y="110" width="200" height="104" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="484" y="120" width="3" height="84" rx="1.5" fill="#5cc8e6"/><text x="500" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="650" fill="#e9eff5" text-anchor="start">log_day()</text><text x="500" y="153" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">adherence recorded;</text><text x="500" y="169" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">arm is computed, not chosen</text><path d="M686 162 L708 162" fill="none" stroke="#74869a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-74869a)"/><rect x="710" y="110" width="200" height="104" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="710" y="120" width="3" height="84" rx="1.5" fill="#4fd0bd"/><text x="726" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="650" fill="#e9eff5" text-anchor="start">refresh_outcomes()</text><text x="726" y="153" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">metric pulled from the</text><text x="726" y="169" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">same data stream as the app</text><path d="M912 162 L934 162" fill="none" stroke="#74869a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-74869a)"/><rect x="936" y="110" width="200" height="104" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="936" y="120" width="3" height="84" rx="1.5" fill="#5fd39a"/><text x="952" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="650" fill="#e9eff5" text-anchor="start">score()</text><text x="952" y="153" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">N-gated verdict, effect,</text><text x="952" y="169" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">bootstrap interval</text><rect x="32" y="262" width="520" height="96" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="32" y="272" width="3" height="76" rx="1.5" fill="#e7be57"/><text x="48" y="286" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#e9eff5" text-anchor="start">Underpowered or null</text><text x="48" y="305" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">Reported as such, with its interval. It does not</text><text x="48" y="321" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">adjust a band, a weight, or a threshold.</text><rect x="648" y="262" width="520" height="96" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="648" y="272" width="3" height="76" rx="1.5" fill="#5fd39a"/><text x="664" y="286" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#e9eff5" text-anchor="start">Confirmed</text><text x="664" y="305" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">Emits an experiment prior the engine may act on,</text><text x="664" y="321" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">under the same audit as the fitted ACWR and volume bands.</text><path d="M1010 216 L1010 260" fill="none" stroke="#5fd39a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-5fd39a)"/><text x="1018" y="244" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#74869a" text-anchor="start">confirmed</text><path d="M1010 216 L1010 216" fill="none" stroke="#74869a" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-74869a)"/><path d="M960 216 L300 216 L300 260" fill="none" stroke="#e7be57" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-e7be57)" stroke-dasharray="5 5"/><text x="640" y="208" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#74869a" text-anchor="middle">N too small or interval spans zero</text></svg>
