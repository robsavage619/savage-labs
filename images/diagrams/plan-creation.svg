<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="How a session is made"><title>How a session is made</title><defs><marker id="a-5fd39a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#5fd39a"/></marker><marker id="a-ec7a63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#ec7a63"/></marker><marker id="a-4fd0bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#4fd0bd"/></marker><marker id="a-74869a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#74869a"/></marker><marker id="a-e7be57" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#e7be57"/></marker><marker id="a-5cc8e6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#5cc8e6"/></marker><marker id="a-a3b3c3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#a3b3c3"/></marker></defs><rect width="1200" height="620" rx="18" fill="#0b1016"/><rect x=".5" y=".5" width="1199" height="619" rx="17.5" fill="none" stroke="#2a3847"/><text x="32" y="44" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5cc8e6" text-anchor="start" letter-spacing="2.2">HOW A SESSION IS MADE</text><text x="32" y="68" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3b3c3" text-anchor="start">Code decides the dose, the structure and the arithmetic. The model chooses and arranges inside them.</text><rect x="32" y="86" width="132" height="22" rx="11" fill="#4fd0bd" fill-opacity=".12" stroke="#4fd0bd" stroke-opacity=".55"/><text x="97.80000000000001" y="101" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#4fd0bd" text-anchor="middle">deterministic code</text><rect x="173.60000000000002" y="86" width="51" height="22" rx="11" fill="#e7be57" fill-opacity=".12" stroke="#e7be57" stroke-opacity=".55"/><text x="199.10000000000002" y="101" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#e7be57" text-anchor="middle">model</text><rect x="234.60000000000002" y="86" width="76" height="22" rx="11" fill="#ec7a63" fill-opacity=".12" stroke="#ec7a63" stroke-opacity=".55"/><text x="272.5" y="101" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#ec7a63" text-anchor="middle">validator</text><rect x="320.40000000000003" y="86" width="70" height="22" rx="11" fill="#5fd39a" fill-opacity=".12" stroke="#5fd39a" stroke-opacity=".55"/><text x="355.20000000000005" y="101" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#5fd39a" text-anchor="middle">feedback</text><rect x="56" y="128" width="250" height="150" rx="12" fill="#121a23" stroke="#2a3847"/><rect x="56" y="140" width="3" height="126" rx="1.5" fill="#4fd0bd"/><text x="74" y="154" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#4fd0bd" text-anchor="start" letter-spacing="1.6">1  WHAT IS ALLOWED</text><text x="74" y="178" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#e9eff5" text-anchor="start">Today's envelope</text><text x="74" y="202" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">Intensity ceiling, forbidden muscle</text><text x="74" y="218" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">groups, deload, effort band. Computed</text><text x="74" y="234" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">once, against the subject's own</text><text x="74" y="250" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">baseline.</text><rect x="334" y="128" width="250" height="150" rx="12" fill="#121a23" stroke="#2a3847"/><rect x="334" y="140" width="3" height="126" rx="1.5" fill="#4fd0bd"/><text x="352" y="154" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#4fd0bd" text-anchor="start" letter-spacing="1.6">2  HOW MANY SETS</text><text x="352" y="178" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#e9eff5" text-anchor="start">Weekly dose</text><text x="352" y="202" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">Per-muscle targets from landmarks fit</text><text x="352" y="218" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">to the subject's own productive weeks.</text><text x="352" y="234" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">Adds shrink when confidence is low;</text><text x="352" y="250" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">cuts never do.</text><rect x="612" y="128" width="250" height="150" rx="12" fill="#121a23" stroke="#2a3847"/><rect x="612" y="140" width="3" height="126" rx="1.5" fill="#4fd0bd"/><text x="630" y="154" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#4fd0bd" text-anchor="start" letter-spacing="1.6">3  WHAT KIND OF DAY</text><text x="630" y="178" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#e9eff5" text-anchor="start">Session shape</text><text x="630" y="202" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">Rotates by sessions executed, not the</text><text x="630" y="218" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">weekday. Split follows real frequency.</text><text x="630" y="234" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">Each day opens with its own anchor,</text><text x="630" y="250" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">held for the whole block.</text><rect x="890" y="128" width="250" height="150" rx="12" fill="#121a23" stroke="#2a3847"/><rect x="890" y="140" width="3" height="126" rx="1.5" fill="#4fd0bd"/><text x="908" y="154" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#4fd0bd" text-anchor="start" letter-spacing="1.6">4  WHICH LIFTS</text><text x="908" y="178" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#e9eff5" text-anchor="start">Exercise menu</text><text x="908" y="202" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">Ranked per muscle, rotated on plateau</text><text x="908" y="218" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">and tenure. Only movements the gym</text><text x="908" y="234" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">has and the training log can record.</text><rect x="890" y="322" width="250" height="150" rx="12" fill="#121a23" stroke="#2a3847"/><rect x="890" y="334" width="3" height="126" rx="1.5" fill="#4fd0bd"/><text x="908" y="348" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#4fd0bd" text-anchor="start" letter-spacing="1.6">5  HOW HEAVY</text><text x="908" y="372" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#e9eff5" text-anchor="start">Load arithmetic</text><text x="908" y="396" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">Double progression off the last logged</text><text x="908" y="412" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">exposure, snapped to the gym's real</text><text x="908" y="428" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">weight steps, capped by today's effort.</text><text x="908" y="444" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">A rotated-in lift gets an effort target.</text><rect x="612" y="322" width="250" height="150" rx="12" fill="#121a23" stroke="#2a3847"/><rect x="612" y="334" width="3" height="126" rx="1.5" fill="#4fd0bd"/><text x="630" y="348" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#4fd0bd" text-anchor="start" letter-spacing="1.6">6  WHAT THE MODEL SEES</text><text x="630" y="372" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#e9eff5" text-anchor="start">Context packet</text><text x="630" y="396" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">All of the above, plus yesterday's plan</text><text x="630" y="412" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">against what actually happened, and</text><text x="630" y="428" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">research excerpts when the data is</text><text x="630" y="444" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">thin.</text><rect x="334" y="322" width="250" height="150" rx="12" fill="#121a23" stroke="#2a3847"/><rect x="334" y="334" width="3" height="126" rx="1.5" fill="#e7be57"/><text x="352" y="348" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#e7be57" text-anchor="start" letter-spacing="1.6">7  THE MODEL</text><text x="352" y="372" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#e9eff5" text-anchor="start">Planner</text><text x="352" y="396" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">Chooses and arranges inside the</text><text x="352" y="412" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">envelope and writes the rationale.</text><text x="352" y="428" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">Arithmetic and policy are served to</text><text x="352" y="444" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">it, not left to it.</text><rect x="56" y="322" width="250" height="150" rx="12" fill="#121a23" stroke="#2a3847"/><rect x="56" y="334" width="3" height="126" rx="1.5" fill="#ec7a63"/><text x="74" y="348" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ec7a63" text-anchor="start" letter-spacing="1.6">8  THE GATE</text><text x="74" y="372" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#e9eff5" text-anchor="start">Validator</text><text x="74" y="396" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">Rejects any plan that breaks a rule</text><text x="74" y="412" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">and names the rule. Never adjusts,</text><text x="74" y="428" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">never negotiates.</text><path d="M308 203 L332 203" fill="none" stroke="#74869a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-74869a)"/><path d="M586 203 L610 203" fill="none" stroke="#74869a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-74869a)"/><path d="M864 203 L888 203" fill="none" stroke="#74869a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-74869a)"/><path d="M1015 280 L1015 320" fill="none" stroke="#74869a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-74869a)"/><path d="M888 397 L864 397" fill="none" stroke="#74869a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-74869a)"/><path d="M610 397 L586 397" fill="none" stroke="#74869a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-74869a)"/><path d="M332 384 L308 384" fill="none" stroke="#74869a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-74869a)"/><path d="M308 420 L332 420" fill="none" stroke="#ec7a63" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-ec7a63)" stroke-dasharray="5 5"/><text x="310" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="600" fill="#ec7a63" text-anchor="start">409</text><rect x="56" y="520" width="1084" height="64" rx="12" fill="#121a23" stroke="#2a3847"/><rect x="56" y="532" width="3" height="40" rx="1.5" fill="#5fd39a"/><text x="74" y="547" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#5fd39a" text-anchor="start" letter-spacing="1.6">STORED, PUSHED TO HEVY AS A ROUTINE, EXECUTED, LOGGED</text><text x="74" y="568" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#a3b3c3" text-anchor="start">Outcomes re-score each lift, grade last week's calls, and refit the landmarks that stages 1 to 5 read next week.</text><path d="M116 474 L116 518" fill="none" stroke="#5fd39a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-5fd39a)"/><text x="128" y="494" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#5fd39a" text-anchor="start">pass</text><path d="M54 552 L26 552 L26 203 L52 203" fill="none" stroke="#5fd39a" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-5fd39a)" stroke-dasharray="5 5"/></svg>
