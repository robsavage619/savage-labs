<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Plan validation loop"><title>Plan validation loop</title><defs><marker id="a-5cc8e6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#5cc8e6"/></marker><marker id="a-a3b3c3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#a3b3c3"/></marker><marker id="a-5fd39a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#5fd39a"/></marker><marker id="a-4fd0bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#4fd0bd"/></marker><marker id="a-ec7a63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#ec7a63"/></marker><marker id="a-e7be57" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#e7be57"/></marker><marker id="a-74869a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#74869a"/></marker></defs><rect width="1200" height="560" rx="18" fill="#0b1016"/><rect x=".5" y=".5" width="1199" height="559" rx="17.5" fill="none" stroke="#2a3847"/><text x="32" y="44" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5cc8e6" text-anchor="start" letter-spacing="2.2">PLAN VALIDATION LOOP</text><text x="32" y="68" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3b3c3" text-anchor="start">The model writes the session. A deterministic layer decides whether it is allowed to exist.</text><rect x="32" y="108" width="230" height="118" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="32" y="118" width="3" height="98" rx="1.5" fill="#5cc8e6"/><text x="48" y="132" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#e9eff5" text-anchor="start">1  Context packet</text><text x="48" y="151" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">DailyState + gates, weekly volume</text><text x="48" y="167" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">remaining, exercise menu with</text><text x="48" y="183" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">rotation tags, vault excerpts</text><rect x="322" y="108" width="230" height="118" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="322" y="118" width="3" height="98" rx="1.5" fill="#e7be57"/><text x="338" y="132" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#e9eff5" text-anchor="start">2  External planner</text><text x="338" y="151" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">Claude, driven from chat.</text><text x="338" y="167" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">The backend never calls a</text><text x="338" y="183" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">model; it serves and checks.</text><rect x="612" y="108" width="230" height="118" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="612" y="118" width="3" height="98" rx="1.5" fill="#5cc8e6"/><text x="628" y="132" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#e9eff5" text-anchor="start">3  POST /workout/plan</text><text x="628" y="151" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">admin-keyed write path.</text><text x="628" y="167" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">Optional override_reason for</text><text x="628" y="183" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">one tier of discretionary load.</text><rect x="902" y="108" width="266" height="118" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="902" y="118" width="3" height="98" rx="1.5" fill="#ec7a63"/><text x="918" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="650" fill="#e9eff5" text-anchor="start">4  validate_plan()</text><text x="918" y="151" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">rejects, never adjusts</text><text x="918" y="167" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">schema, gates, ceilings, budget,</text><text x="918" y="183" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a3b3c3" text-anchor="start">and a stack of numbered rules</text><path d="M264 167 L320 167" fill="none" stroke="#74869a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-74869a)"/><path d="M554 167 L610 167" fill="none" stroke="#74869a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-74869a)"/><path d="M844 167 L900 167" fill="none" stroke="#74869a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-74869a)"/><rect x="32" y="262" width="1136" height="214" rx="14" fill="#17212c" fill-opacity=".55" stroke="#2a3847" stroke-dasharray="4 5"/><text x="46" y="284" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ec7a63" text-anchor="start" letter-spacing="1.8">WHAT THE VALIDATOR CHECKS</text><rect x="48" y="296" width="266" height="72" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="48" y="306" width="3" height="52" rx="1.5" fill="#ec7a63"/><text x="64" y="320" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e9eff5" text-anchor="start">Gates</text><text x="64" y="346" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a3b3c3" text-anchor="start">intensity cap, forbidden groups, deload</text><rect x="328" y="296" width="266" height="72" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="328" y="306" width="3" height="52" rx="1.5" fill="#ec7a63"/><text x="344" y="320" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e9eff5" text-anchor="start">Load ceiling</text><text x="344" y="346" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a3b3c3" text-anchor="start">per-exercise e1RM at today's cap</text><rect x="608" y="296" width="266" height="72" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="608" y="306" width="3" height="52" rx="1.5" fill="#ec7a63"/><text x="624" y="320" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e9eff5" text-anchor="start">Effort coherence</text><text x="624" y="346" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a3b3c3" text-anchor="start">reps, RPE and weight must agree</text><rect x="888" y="296" width="266" height="72" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="888" y="306" width="3" height="52" rx="1.5" fill="#ec7a63"/><text x="904" y="320" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e9eff5" text-anchor="start">Volume</text><text x="904" y="346" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a3b3c3" text-anchor="start">per-muscle caps, direct sets, ramps</text><rect x="48" y="384" width="266" height="72" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="48" y="394" width="3" height="52" rx="1.5" fill="#ec7a63"/><text x="64" y="408" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e9eff5" text-anchor="start">Session budget</text><text x="64" y="434" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a3b3c3" text-anchor="start">working-set cap, about one hour</text><rect x="328" y="384" width="266" height="72" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="328" y="394" width="3" height="52" rx="1.5" fill="#ec7a63"/><text x="344" y="408" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e9eff5" text-anchor="start">Exercise identity</text><text x="344" y="434" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a3b3c3" text-anchor="start">loggable, equipment present</text><rect x="608" y="384" width="266" height="72" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="608" y="394" width="3" height="52" rx="1.5" fill="#ec7a63"/><text x="624" y="408" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e9eff5" text-anchor="start">Physical limits</text><text x="624" y="434" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a3b3c3" text-anchor="start">per-hand dumbbell and cable bound</text><rect x="888" y="384" width="266" height="72" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="888" y="394" width="3" height="52" rx="1.5" fill="#ec7a63"/><text x="904" y="408" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e9eff5" text-anchor="start">Clinical guard</text><text x="904" y="434" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a3b3c3" text-anchor="start">contraindications, never overridable</text><rect x="32" y="500" width="280" height="44" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="32" y="510" width="3" height="24" rx="1.5" fill="#5fd39a"/><text x="48" y="524" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#e9eff5" text-anchor="start">pass: stored, optionally pushed to Hevy</text><rect x="342" y="500" width="330" height="44" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="342" y="510" width="3" height="24" rx="1.5" fill="#ec7a63"/><text x="358" y="524" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#e9eff5" text-anchor="start">fail: HTTP 409 with the violated rule named</text><rect x="702" y="500" width="466" height="44" rx="10" fill="#121a23" stroke="#2a3847"/><rect x="702" y="510" width="3" height="24" rx="1.5" fill="#e7be57"/><text x="718" y="524" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#e9eff5" text-anchor="start">override: loosens max_intensity by one tier only, logged to gate_overrides</text><path d="M1035 228 L1035 262" fill="none" stroke="#ec7a63" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-ec7a63)"/><text x="1043" y="248" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#74869a" text-anchor="start">every plan</text></svg>
